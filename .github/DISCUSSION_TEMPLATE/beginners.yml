title: "[Hello] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎简短交流，无需先建计划或参加排名。此讨论公开，请只分享你愿意公开的信息。
        发帖、点赞和回复不会自动增加积分；具体经验可整理为 Experience sharing Issue 申请审核。
  - type: textarea
    id: introduction
    attributes:
      label: "A short introduction"
      description: "简单介绍一下自己，以及为什么想来这里。可以不写单位、具体位置和身体指标。"
    validations:
      required: true
  - type: textarea
    id: interests
    attributes:
      label: "What I would like to try"
      description: "想记录哪些运动、饮食或习惯？刚开始、重新回来都欢迎。"
    validations:
      required: false
  - type: textarea
    id: welcome-help
    attributes:
      label: "How members can help"
      description: "希望有人打个招呼、一起尝试什么，或解释哪一步？"
    validations:
      required: false

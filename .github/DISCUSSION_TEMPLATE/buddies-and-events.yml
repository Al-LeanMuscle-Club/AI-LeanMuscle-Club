title: "[Buddies] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎简短交流，无需先建计划或参加排名。此讨论公开，请只分享你愿意公开的信息。
        发帖、点赞和回复不会自动增加积分；具体经验可整理为 Experience sharing Issue 申请审核。
  - type: textarea
    id: proposal
    attributes:
      label: "Activity or invitation"
      description: "想找什么运动搭子，或组织什么活动？"
    validations:
      required: true
  - type: textarea
    id: availability
    attributes:
      label: "General availability"
      description: "可选大致时间、时区、线上或线下。不要公开私人联系方式或精确住址。"
    validations:
      required: false
  - type: textarea
    id: joining
    attributes:
      label: "How to join"
      description: "可以先在此贴回复；约定活动范围、人数或取消方式。不要替他人报名。"
    validations:
      required: false

title: "[Research / Agent] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎简短交流，无需先建计划或参加排名。此讨论公开，请只分享你愿意公开的信息。
        发帖、点赞和回复不会自动增加积分；具体经验可整理为 Experience sharing Issue 申请审核。
  - type: textarea
    id: workflow
    attributes:
      label: "Task and workflow"
      description: "处理什么任务？采用了什么研究或 Agent 工作流？只分享可公开的材料。"
    validations:
      required: true
  - type: textarea
    id: checking
    attributes:
      label: "Checking and rework"
      description: "可选设置、人工检查、返工和错误处理过程。"
    validations:
      required: false
  - type: textarea
    id: outcome
    attributes:
      label: "Outcome and limits"
      description: "实际净节时、局限，以及是否用来运动或休息；不清楚时不必报数字。"
    validations:
      required: false

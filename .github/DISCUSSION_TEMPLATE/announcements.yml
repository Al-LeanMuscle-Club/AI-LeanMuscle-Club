title: "[Club] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎简短交流，无需先建计划或参加排名。此讨论公开，请只分享你愿意公开的信息。
        发帖、点赞和回复不会自动增加积分；具体经验可整理为 Experience sharing Issue 申请审核。
  - type: textarea
    id: announcement
    attributes:
      label: "Announcement"
      description: "维护者发布社区安排、规则调整或活动通知。请写清适用范围。"
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: "What members need to do"
      description: "可选参与步骤、时间与时区、原始链接。没有需要采取的行动可以留空。"
    validations:
      required: false

name: "Nutrition / 饮食交流"
description: "Share food, preparation ideas, or a question; no plan or scoring. 分享餐食、准备方法或饮食问题，无需周计划，不计分。"
title: "[Food] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎简短交流，无需先建周计划或参加排名。此社区 Issue 公开，请只分享你愿意公开的信息。
        Short posts are welcome. No weekly plan or leaderboard participation is required. This community Issue is public; share only what you want public.
        这类帖子、点赞和回复不计分；想申请经验贡献审核，请使用单独的 Experience sharing 表单。
        Posts, reactions, and replies here earn no points. For contribution review, use the separate Experience sharing form.
  - type: textarea
    id: food-topic
    attributes:
      label: "Meal or question"
      description: "分享一顿饭、准备食物的办法，或一个想交流的问题。 Share a meal, a way to prepare food, or a question you would like to discuss."
    validations:
      required: true
  - type: textarea
    id: food-context
    attributes:
      label: "Optional food context"
      description: "可选食材、分量和准备方式。照片和热量都不是必需。 Optional ingredients, portions, and preparation. Photos and calories are not required."
    validations:
      required: false
  - type: textarea
    id: food-source
    attributes:
      label: "Optional estimate and source"
      description: "填写营养数值时请注明来源、假设与未知信息；模型估算不是测量结果。 If including nutrition numbers, state sources, assumptions, and unknowns. Model estimates are not measurements."
    validations:
      required: false

name: "经验分享 / Experience sharing"
description: "分享运动、科研与生活中的亲身尝试，邀请大家交流。"
title: "[Experience] "
body:
  - type: markdown
    attributes:
      value: |
        分享实际做过的事、效果和局限。无需选择周次或申请贡献分，经验分享不影响打卡榜单。
        所有内容公开；如果只想问一句话，也可以选择“我也参与 / Join the conversation”。
        Share your own experience and what happened. Experiences and replies do not add leaderboard points.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "遇到什么问题？当时有什么时间或场景限制？"
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: What I tried
      description: "实际采用了什么做法？可以附原始讨论或记录链接。"
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: What happened
      description: "实际效果、没有奏效的地方，以及适用条件。"
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: Limits and sources
      description: "选填局限、来源和不确定性。区分亲身观察与一般性结论。"
    validations:
      required: false

name: Update weekly participation reports
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
    inputs:
      week_start:
        description: 'Optional older report week, a Monday YYYY-MM-DD'
        required: false
        type: string
  issues:
    types: [opened, edited, labeled, unlabeled, deleted]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: write
  issues: read
concurrency:
  group: community-reports-${{ github.repository_id }}
  cancel-in-progress: false
jobs:
  report:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && github.event.sender.type != 'Bot'
      && !github.event.issue.pull_request
      && (
        github.event_name != 'issue_comment'
        || contains(github.event.issue.labels.*.name, 'weekly-plan')
      )
      && (
        github.event_name != 'issues'
        || github.event.action == 'deleted'
        || contains(github.event.issue.labels.*.name, 'weekly-plan')
        || contains(github.event.issue.labels.*.name, 'experience')
        || contains(github.event.issue.labels.*.name, 'points-approved')
        || contains(fromJSON('["weekly-plan","experience","points-approved"]'), github.event.label.name)
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Decide whether the event changes reports
        id: report-event
        run: python scripts/report_event.py
      - uses: actions/cache@v4
        if: steps.report-event.outputs.run == 'true'
        with:
          path: .club-cache
          key: community-issues-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: community-issues-${{ github.repository_id }}-
      - name: Calculate reports from real GitHub records
        if: steps.report-event.outputs.run == 'true'
        run: |
          if [ -n "$REPORT_WEEK" ]; then
            python scripts/sync_github.py --week "$REPORT_WEEK"
          else
            python scripts/sync_github.py
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_WEEK: ${{ inputs.week_start }}
      - name: Commit reports and confirmed plan snapshots
        if: steps.report-event.outputs.run == 'true'
        # GITHUB_TOKEN pushes do not trigger push workflows. The optional
        # Pages workflow listens for this workflow's successful completion.
        run: |
          git add -- README.md reports/ data/ranking-state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update participation reports and confirmations"
          git push origin "HEAD:$REPORT_BRANCH"
        env:
          REPORT_BRANCH: ${{ github.event.repository.default_branch }}

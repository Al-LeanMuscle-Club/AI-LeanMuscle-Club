name: Update weekly participation reports
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
    inputs:
      week_start:
        description: 'Optional older report week, a Monday YYYY-MM-DD'
        required: false
        type: string
permissions:
  contents: write
  issues: read
concurrency:
  group: community-reports-${{ github.repository_id }}
  cancel-in-progress: false
jobs:
  report:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Daily and explicit manual updates use trusted default-branch code only.
    # Keep the workflow name stable for the optional Pages completion trigger.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Count work and exercise days from personal check-in journals
        run: |
          ARGS=()
          if [ -n "$REPORT_WEEK" ]; then
            ARGS+=(--week "$REPORT_WEEK")
          fi
          python scripts/sync_daily.py "${ARGS[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_WEEK: ${{ inputs.week_start }}
      - name: Commit only the new public board and homepage overview
        # GITHUB_TOKEN pushes do not trigger push workflows. The optional
        # Pages workflow listens for this workflow's successful completion.
        run: |
          git add -- README.md README.zh-CN.md reports/daily/
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update daily check-in weekly board"
          git push origin "HEAD:$REPORT_BRANCH"
        env:
          REPORT_BRANCH: ${{ github.event.repository.default_branch }}

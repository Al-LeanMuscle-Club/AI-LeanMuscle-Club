name: Publish optional member helper
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Stage only the member helper and public reports
        run: |
          mkdir -p .club-site
          cp -R tools reports examples .club-site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .club-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}tools/
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

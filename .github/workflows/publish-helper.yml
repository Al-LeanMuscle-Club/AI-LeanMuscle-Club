name: Publish optional member helper
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Update weekly participation reports]
    types: [completed]
  push:
    paths:
      - 'tools/**'
      - 'reports/**'
      - 'examples/**'
      - '.github/workflows/publish-helper.yml'
permissions:
  contents: read
concurrency:
  group: community-pages
  cancel-in-progress: false
jobs:
  build:
    # Manual publishing is explicit consent. Automatic publishing requires a
    # repository setting and a trusted default-branch event; never use PR code
    # or artifacts from the completed workflow.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (
        github.event_name == 'workflow_dispatch'
        || (
          vars.PUBLISH_MEMBER_HELPER == 'true'
          && (
            github.event_name == 'push'
            || (
              github.event_name == 'workflow_run'
              && github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.head_branch == github.event.repository.default_branch
              && github.event.workflow_run.head_repository.full_name == github.repository
              && contains(fromJSON('["schedule", "workflow_dispatch", "issues", "issue_comment", "push"]'), github.event.workflow_run.event)
            )
          )
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          # The report job may have pushed a newer commit than the event SHA.
          # Always publish the latest trusted reports and helper together.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Stage only the member helper and public reports
        run: |
          mkdir -p .club-site
          cp -R tools reports examples .club-site/
          # A friendly root URL redirects to the existing member helper.
          cp tools/pages-landing.html .club-site/index.html
          test -s .club-site/tools/index.html
          test -s .club-site/tools/app.js
          test -s .club-site/reports/index.json
          python -m json.tool .club-site/reports/index.json >/dev/null
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .club-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}tools/
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

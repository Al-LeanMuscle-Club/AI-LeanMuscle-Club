name: Publish optional member helper
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Update weekly participation reports]
    types: [completed]
  push:
    paths:
      - 'tools/**'
      - 'reports/**'
      - 'scripts/member_entry.py'
      - '.github/workflows/publish-helper.yml'
permissions:
  contents: read
concurrency:
  group: community-pages
  cancel-in-progress: false
jobs:
  build:
    # Manual publishing is explicit consent. Automatic publishing requires a
    # repository setting and a trusted default-branch event; never use PR code
    # or artifacts from the completed workflow.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (
        github.event_name == 'workflow_dispatch'
        || (
          vars.PUBLISH_MEMBER_HELPER == 'true'
          && (
            github.event_name == 'push'
            || (
              github.event_name == 'workflow_run'
              && github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.head_branch == github.event.repository.default_branch
              && github.event.workflow_run.head_repository.full_name == github.repository
              && contains(fromJSON('["schedule", "workflow_dispatch", "issues", "issue_comment", "push"]'), github.event.workflow_run.event)
            )
          )
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          # The report job may have pushed a newer commit than the event SHA.
          # Always publish the latest trusted reports and helper together.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Stage only the member helper and public reports
        run: |
          mkdir -p .club-site
          cp -R tools reports .club-site/
          # A friendly root URL redirects to the existing member helper.
          cp tools/pages-landing.html .club-site/index.html
          test -s .club-site/tools/index.html
          test -s .club-site/tools/app.js
          test -s .club-site/reports/daily/index.json
          python -m json.tool .club-site/reports/daily/index.json >/dev/null
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .club-site
  deploy:
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}tools/
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show the live member entry
        env:
          MEMBER_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Member helper: ' + os.environ['MEMBER_PAGE_URL'].rstrip('/') + '/tools/\n')
          PY
  update-entry:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize with report commits, which also update the Chinese README.
    concurrency:
      group: community-reports-${{ github.repository_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Link to the successfully deployed site
        env:
          MEMBER_PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          REPORT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python scripts/member_entry.py
          git add -- README.md README.en.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Link member helper to deployed Pages site"
          git push origin "HEAD:$REPORT_BRANCH"

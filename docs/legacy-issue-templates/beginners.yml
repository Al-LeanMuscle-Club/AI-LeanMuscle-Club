name: "Beginners / 新人报到"
description: "Introduce yourself or return after a break; no plan or scoring. 新人报到或中断后回来，无需周计划，不计分。"
title: "[Hello] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎简短交流，无需先建周计划或参加排名。此社区 Issue 公开，请只分享你愿意公开的信息。
        Short posts are welcome. No weekly plan or leaderboard participation is required. This community Issue is public; share only what you want public.
        这类帖子、点赞和回复不计分；想申请经验贡献审核，请使用单独的 Experience sharing 表单。
        Posts, reactions, and replies here earn no points. For contribution review, use the separate Experience sharing form.
  - type: textarea
    id: introduction
    attributes:
      label: "A short introduction"
      description: "简单介绍一下自己，以及为什么想来这里。可以不写单位、具体位置和身体指标。 Briefly introduce yourself and why you are here. Employer, specific location, and body metrics are optional."
    validations:
      required: true
  - type: textarea
    id: interests
    attributes:
      label: "What I would like to try"
      description: "想记录哪些运动、饮食或习惯？刚开始、重新回来都欢迎。 What activities, meals, or habits would you like to record? Starting and returning members are welcome."
    validations:
      required: false
  - type: textarea
    id: welcome-help
    attributes:
      label: "How members can help"
      description: "希望有人打个招呼、一起尝试什么，或解释哪一步？ Would you like a greeting, someone to try something with, or help understanding a step?"
    validations:
      required: false

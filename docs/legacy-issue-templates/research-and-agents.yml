name: "Research and agents / 科研与 Agent"
description: "Share research or Agent workflows and their limits; no plan or scoring. 交流科研或 Agent 工作流与局限，无需周计划，不计分。"
title: "[Research / Agent] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎简短交流，无需先建周计划或参加排名。此社区 Issue 公开，请只分享你愿意公开的信息。
        Short posts are welcome. No weekly plan or leaderboard participation is required. This community Issue is public; share only what you want public.
        这类帖子、点赞和回复不计分；想申请经验贡献审核，请使用单独的 Experience sharing 表单。
        Posts, reactions, and replies here earn no points. For contribution review, use the separate Experience sharing form.
  - type: textarea
    id: workflow
    attributes:
      label: "Task and workflow"
      description: "处理什么任务？采用了什么研究或 Agent 工作流？只分享可公开的材料。 What task did you work on, and what research or Agent workflow did you use? Share only material you can make public."
    validations:
      required: true
  - type: textarea
    id: checking
    attributes:
      label: "Checking and rework"
      description: "可选设置、人工检查、返工和错误处理过程。 Optional setup, human checks, rework, and error handling."
    validations:
      required: false
  - type: textarea
    id: outcome
    attributes:
      label: "Outcome and limits"
      description: "实际净节时、局限，以及是否用来运动或休息；不清楚时不必报数字。 Describe net time saved, limitations, and whether it went toward exercise or rest. Numbers are not required when unknown."
    validations:
      required: false
